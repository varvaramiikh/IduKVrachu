    @media (max-width: 900px) {

      .form-grid { grid-template-columns: 1fr; }
      .form-grid-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

// ── API helper ────────────────────────────────────────────
const EMPTY_DATA = { services: [], cities: [], clinics: [], doctors: [], content: [], roles: [], adminUsers: [] };

async function apiFetch(path, options = {}) {
  const token = localStorage.getItem("admin_token");
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.removeItem("admin_token");
    localStorage.removeItem("admin_username");
    window.location.reload();
    throw new Error("Unauthorized");
  }
  return res;
}

async function loadAllData(me) {
  const isSuper = !!(me && me.is_superadmin);
  const tasks = [
    apiFetch("/admin/api/services").then(r => r.json()),
    apiFetch("/admin/api/cities").then(r => r.json()),
    apiFetch("/admin/api/clinics").then(r => r.json()),
    apiFetch("/admin/api/doctors").then(r => r.json()),
    apiFetch("/admin/api/content").then(r => r.json()),
    isSuper ? apiFetch("/admin/api/admin-users").then(r => r.json()) : Promise.resolve([]),
  ];
  const [services, cities, clinics, doctors, content, adminUsers] = await Promise.all(tasks);
  return { services, cities, clinics, doctors, content, roles: [], adminUsers };
}

// ── Login screen ──────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [username, setUsername] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError("");
    try {
      const res = await fetch("/admin/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("admin_token", data.token);
        localStorage.setItem("admin_username", data.username);
        onLogin(data.username);
      } else {
        setError("Неверный логин или пароль");
      }
    } catch {
      setError("Ошибка подключения к серверу");
    }
    setLoading(false);
  };

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", background: "var(--app-bg)" }}>
      <div style={{ background: "#fff", borderRadius: 20, padding: 40, width: 360, boxShadow: "var(--shadow-lg)" }}>
        <div style={{ fontFamily: "Unbounded, sans-serif", fontSize: 15, fontWeight: 700, color: "var(--brand-dark)", marginBottom: 4 }}>Иду к врачу</div>
        <div style={{ fontSize: 13, color: "var(--text)", marginBottom: 28 }}>Панель управления</div>
        <form onSubmit={submit}>
          <div className="form-group" style={{ marginBottom: 12 }}>
            <label className="form-label">Логин</label>
            <input className="form-input" value={username} onChange={e => setUsername(e.target.value)} placeholder="admin" autoFocus />
          </div>
          <div className="form-group" style={{ marginBottom: 20 }}>
            <label className="form-label">Пароль</label>
            <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          {error && <div style={{ color: "#e53e3e", fontSize: 13, marginBottom: 12 }}>{error}</div>}
          <button className="btn btn-primary" type="submit" disabled={loading} style={{ width: "100%", justifyContent: "center" }}>
            {loading ? "Входим…" : "Войти"}
          </button>
        </form>
      </div>
    </div>
  );
}

  const openEdit = (item) => { setForm({ ...item }); setModal("edit"); };

  const toPayload = (f) => ({
    clinic_id: isSuper ? (f.clinic_id ?? defaultClinicId) : (me?.clinic_id ?? null),
    name: f.name, desc: f.desc || "", icon: f.icon || "", active: !!f.active,
  });

  const save = async () => {
    const url = modal === "add" ? "/admin/api/services" : `/admin/api/services/${form.id}`;
    const res = await apiFetch(url, { method: modal === "add" ? "POST" : "PUT", body: JSON.stringify(toPayload(form)) });

    else setData(d => ({ ...d, services: d.services.map(s => s.id === form.id ? saved : s) }));

    await apiFetch(`/admin/api/services/${id}`, { method: "DELETE" });

// ── Avatar crop dialog ────────────────────────────────────
function AvatarCropDialog({ src, onConfirm, onCancel }) {
  const SIZE = 240;
  const OUTPUT = 256;
  const canvasRef = React.useRef(null);
  const imgRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const [imgSize, setImgSize] = React.useState({ w: 0, h: 0 });
  const [scale, setScale] = React.useState(1);
  const [offset, setOffset] = React.useState({ x: 0, y: 0 });
  const [ready, setReady] = React.useState(false);

  const minScale = imgSize.w ? Math.max(SIZE / imgSize.w, SIZE / imgSize.h) : 1;
  const maxScale = minScale * 4;

  const clamp = (ox, oy, sc) => ({
    x: Math.min(0, Math.max(SIZE - imgSize.w * sc, ox)),
    y: Math.min(0, Math.max(SIZE - imgSize.h * sc, oy)),
  });

  const onImgLoad = () => {
    const img = imgRef.current;
    if (!img) return;
    const w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.max(SIZE / w, SIZE / h);
    setImgSize({ w, h });
    setScale(sc);
    setOffset({ x: (SIZE - w * sc) / 2, y: (SIZE - h * sc) / 2 });
    setReady(true);
  };

  const startDrag = (cx, cy) => { dragRef.current = { cx, cy, ox: offset.x, oy: offset.y }; };
  const moveDrag = (cx, cy) => {
    if (!dragRef.current) return;
    const { cx: sx, cy: sy, ox, oy } = dragRef.current;
    setOffset(clamp(ox + cx - sx, oy + cy - sy, scale));
  };
  const endDrag = () => { dragRef.current = null; };

  const handleScaleChange = (newSc) => {
    if (!scale) return;
    const cx = SIZE / 2, cy = SIZE / 2;
    const newOx = cx - (cx - offset.x) / scale * newSc;
    const newOy = cy - (cy - offset.y) / scale * newSc;
    setScale(newSc);
    setOffset(clamp(newOx, newOy, newSc));
  };

  const handleConfirm = () => {
    const canvas = canvasRef.current;
    canvas.width = OUTPUT;
    canvas.height = OUTPUT;
    const ctx = canvas.getContext("2d");
    const srcX = -offset.x / scale;
    const srcY = -offset.y / scale;
    const srcSide = SIZE / scale;
    ctx.drawImage(imgRef.current, srcX, srcY, srcSide, srcSide, 0, 0, OUTPUT, OUTPUT);
    onConfirm(canvas.toDataURL("image/jpeg", 0.92));
  };

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 10000,
      background: "rgba(15, 23, 42, 0.55)", display: "flex",
      alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div style={{
        background: "#fff", borderRadius: 18, padding: "22px 22px 20px",
        width: 320, maxWidth: "100%",
        boxShadow: "0 20px 60px rgba(15, 23, 42, 0.28)",
      }}>
        <h3 style={{ margin: "0 0 4px", fontSize: 16, fontWeight: 700, color: "var(--title)" }}>Выбор области фото</h3>
        <p style={{ margin: "0 0 16px", fontSize: 13, color: "var(--text)" }}>Перетащите изображение и настройте масштаб</p>

        <div style={{ position: "relative", width: SIZE, height: SIZE, margin: "0 auto 18px" }}>
          <div
            style={{
              position: "absolute", inset: 0, borderRadius: "50%",
              overflow: "hidden", cursor: "grab",
              background: "#f3f4f6", userSelect: "none",
              touchAction: "none",
              boxShadow: "0 0 0 3px var(--brand)",
            }}
            onMouseDown={e => { e.preventDefault(); startDrag(e.clientX, e.clientY); }}
            onMouseMove={e => moveDrag(e.clientX, e.clientY)}
            onMouseUp={endDrag}
            onMouseLeave={endDrag}
            onTouchStart={e => startDrag(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={e => { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }}
            onTouchEnd={endDrag}
          >
            <img
              ref={imgRef}
              src={src}
              alt=""
              draggable={false}
              onLoad={onImgLoad}
              style={{
                position: "absolute",
                left: offset.x, top: offset.y,
                width: imgSize.w * scale || "auto",
                height: imgSize.h * scale || "auto",
                maxWidth: "none",
                pointerEvents: "none",
              }}
            />
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
          <span style={{ fontSize: 18, color: "#9ca3af", lineHeight: 1, width: 12, textAlign: "center" }}>−</span>
          <input
            type="range"
            style={{ flex: 1, accentColor: "var(--brand)" }}
            min={minScale} max={maxScale}
            step={(maxScale - minScale) / 100 || 0.01}
            value={scale}
            disabled={!ready}
            onChange={e => handleScaleChange(parseFloat(e.target.value))}
          />
          <span style={{ fontSize: 18, color: "#9ca3af", lineHeight: 1, width: 12, textAlign: "center" }}>+</span>
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-secondary" style={{ flex: 1 }} onClick={onCancel}>Отмена</button>
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={handleConfirm} disabled={!ready}>Применить</button>
        </div>
        <canvas ref={canvasRef} style={{ display: "none" }} />
      </div>
    </div>
  );
}

// ── Schedule modal ────────────────────────────────────────
function ScheduleModal({ doctor, onClose }) {
  const TIMES = ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","13:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30"];
  const emptySlots = () => {
    const s = {};
    DAYS.forEach((d, di) => { s[di] = {}; TIMES.forEach(t => { s[di][t] = false; }); });
    return s;
  };
  const [slots, setSlots] = useState(emptySlots);
  const [workDays, setWorkDays] = useState([0,1,2,3,4]);
  const [saving, setSaving] = React.useState(false);

  React.useEffect(() => {
    apiFetch(`/admin/api/doctors/${doctor.id}/schedule`).then(r => r.json()).then(({ slots: raw }) => {
      const s = emptySlots();
      for (const [day, times] of Object.entries(raw || {})) {
        for (const [t, v] of Object.entries(times)) { if (s[+day]) s[+day][t] = !!v; }
      }
      setSlots(s);
      const activeDays = Object.entries(raw || {}).filter(([, times]) => Object.values(times).some(Boolean)).map(([d]) => +d);
      if (activeDays.length) setWorkDays(activeDays);
    });
  }, [doctor.id]);

  const toggle = (di, t) => setSlots(s => ({ ...s, [di]: { ...s[di], [t]: !s[di][t] } }));
  const toggleDay = (di) => setWorkDays(w => w.includes(di) ? w.filter(x => x !== di) : [...w, di]);

  const saveSchedule = async () => {
    setSaving(true);
    const payload = {};
    DAYS.forEach((d, di) => { payload[String(di)] = {}; TIMES.forEach(t => { payload[String(di)][t] = workDays.includes(di) && !!slots[di]?.[t]; }); });
    await apiFetch(`/admin/api/doctors/${doctor.id}/schedule`, { method: "PUT", body: JSON.stringify({ slots: payload }) });
    setSaving(false);
    onClose();
  };

  return (
    <Modal title={`Расписание — ${doctor.name}`} onClose={onClose} lg
      footer={<><button className="btn btn-secondary" onClick={onClose}>Отмена</button><button className="btn btn-primary" onClick={saveSchedule} disabled={saving}>{saving ? "Сохраняем…" : "Сохранить расписание"}</button></>}>
      <div style={{ marginBottom: 16 }}>
        <div className="form-label" style={{ marginBottom: 8 }}>Рабочие дни</div>
        <div className="day-toggle">
          {DAYS.map((d, di) => (
            <button key={di} className={`day-btn${workDays.includes(di) ? " on" : ""}`} onClick={() => toggleDay(di)}>{d}</button>
          ))}
        </div>
      </div>
      <div style={{ marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--text)", marginBottom: 8 }}>
          <span className="badge badge-teal">■ Доступен</span>
          <span className="badge badge-gray">■ Недоступен</span>
          <span style={{ marginLeft: "auto" }}>Нажмите на ячейку для переключения</span>
        </div>
      </div>
      <div style={{ overflowX: "auto" }}>
        <div className="schedule-grid" style={{ minWidth: 520 }}>
          <div className="sch-head">Время</div>
          {DAYS.map((d, di) => (
            <div key={di} className="sch-head" style={{ color: workDays.includes(di) ? "var(--brand-dark)" : "#c0cdd4" }}>{d}</div>
          ))}
          {TIMES.map(t => (
            <React.Fragment key={t}>
              <div className="sch-time">{t}</div>
              {DAYS.map((d, di) => (
                <button key={di}
                  className={`sch-slot${!workDays.includes(di) ? " busy" : slots[di]?.[t] ? " active" : ""}`}
                  onClick={() => workDays.includes(di) && toggle(di, t)}
                  style={{ cursor: workDays.includes(di) ? "pointer" : "default" }}>
                  {workDays.includes(di) ? (slots[di]?.[t] ? "✓" : "—") : "—"}
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>
      </div>
    </Modal>
  );
}

  const save = async () => {
    const url = modal === "add" ? "/admin/api/roles" : `/admin/api/roles/${form.id}`;

// ── Appointments ──────────────────────────────────────────
function formatDt(s) {
  if (!s) return "";
  // Backend serializes naive UTC datetimes (no offset); add 'Z' so the browser
  // converts to the local timezone (UTC+3 for Moscow clinics).
  const iso = (s.includes("Z") || s.includes("+") || /[-]\d{2}:\d{2}$/.test(s)) ? s : s + "Z";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

const APPT_STATUS = {
  pending: { label: "Ожидает подтверждения", cls: "badge-orange" },
  scheduled: { label: "Подтверждена", cls: "badge-green" },
  cancelled: { label: "Отменена", cls: "badge-gray" },
  completed: { label: "Завершена", cls: "badge-teal" },
};

function AppointmentsSection({ me, onChanged }) {
  const [items, setItems] = useState([]);
  const [filter, setFilter] = useState("all");
  const [loading, setLoading] = useState(true);
  const isSuper = !!me?.is_superadmin;

  const load = async () => {
    setLoading(true);
    const q = filter === "all" ? "" : `?status=${encodeURIComponent(filter)}`;
    const r = await apiFetch(`/admin/api/appointments${q}`);
    if (r.ok) setItems(await r.json());
    setLoading(false);
  };
  React.useEffect(() => { load(); }, [filter]);

  const confirm = async (id) => {
    const r = await apiFetch(`/admin/api/appointments/${id}/confirm`, { method: "POST" });
    if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.detail || "Ошибка"); return; }
    await load();
    onChanged?.();
  };
  const cancel = async (id) => {
    if (!window.confirm("Отменить запись?")) return;
    const r = await apiFetch(`/admin/api/appointments/${id}/cancel`, { method: "POST" });
    if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.detail || "Ошибка"); return; }
    await load();
    onChanged?.();
  };

  return (
    <div>
      <div className="section-head">
        <div>
          <div className="section-title">Записи пациентов</div>

        </div>
      </div>
      <div className="tabs">
        {[
          { v: "all", l: "Все" },
          { v: "pending", l: "Ожидают" },
          { v: "scheduled", l: "Подтверждены" },
          { v: "cancelled", l: "Отменены" },

          <button key={t.v} className={`tab${filter === t.v ? " active" : ""}`} onClick={() => setFilter(t.v)}>{t.l}</button>

      </div>
      <div className="card" style={{ padding: 0 }}>
        <div className="table-wrap"><table>
          <thead><tr>
            <th>Время</th>
            <th>Пациент</th>
            <th>Услуга</th>
            {isSuper && <th>Клиника</th>}
            <th>Контакт</th>
            <th>Статус</th>
            <th style={{ width: 160 }}>Действия</th>
          </tr></thead>
          <tbody>
            {loading && (
              <tr><td colSpan={isSuper ? 7 : 6} style={{ textAlign: "center", padding: "32px", color: "var(--text)" }}>Загрузка…</td></tr>
            )}
            {!loading && items.length === 0 && (
              <tr><td colSpan={isSuper ? 7 : 6} style={{ textAlign: "center", padding: "32px", color: "var(--text)" }}>Записей нет</td></tr>
            )}
            {!loading && items.map(a => {
              const st = APPT_STATUS[a.status] || { label: a.status, cls: "badge-gray" };
              return (
                <tr key={a.id}>
                  <td style={{ fontSize: 13, fontWeight: 600 }}>{formatDt(a.slot_datetime)}</td>
                  <td><strong>{a.child_name || "—"}</strong>{a.parent_name && <div style={{ fontSize: 12, color: "var(--text)" }}>Родитель: {a.parent_name}</div>}</td>
                  <td style={{ fontSize: 13 }}>{a.service_name}</td>
                  {isSuper && <td style={{ fontSize: 13 }}>{a.clinic_name}</td>}
                  <td style={{ fontSize: 13, color: "var(--text)" }}>{a.parent_phone || "—"}</td>
                  <td><span className={`badge ${st.cls}`}>{st.label}</span></td>
                  <td>
                    <div style={{ display: "flex", gap: 6 }}>
                      {a.status === "pending" && (
                        <button className="btn btn-primary btn-sm" onClick={() => confirm(a.id)}>Подтвердить</button>
                      )}
                      {(a.status === "pending" || a.status === "scheduled") && (
                        <button className="btn-icon" style={{ background: "#fef2f2", color: "#e53e3e" }} title="Отменить" onClick={() => cancel(a.id)}><Ico name="close" /></button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>
    </div>
  );
}


// ── Notifications bell ────────────────────────────────────
function NotificationsBell({ me, onConfirm, onJumpAppointments }) {
  const [open, setOpen] = useState(false);
  const [items, setItems] = useState([]);
  const [count, setCount] = useState(0);

  const refresh = React.useCallback(async () => {
    try {
      const [listRes, cntRes] = await Promise.all([
        apiFetch("/admin/api/notifications?limit=50"),
        apiFetch("/admin/api/notifications/unread-count"),
      ]);
      if (listRes.ok) setItems(await listRes.json());
      if (cntRes.ok) setCount((await cntRes.json()).count || 0);
    } catch {}
  }, []);

  React.useEffect(() => {
    refresh();
    const t = setInterval(refresh, 20000);
    return () => clearInterval(t);
  }, [refresh]);

  const markRead = async (id) => {
    await apiFetch(`/admin/api/notifications/${id}/read`, { method: "POST" });
    refresh();
  };
  const markAll = async () => {
    await apiFetch("/admin/api/notifications/read-all", { method: "POST" });
    refresh();
  };

  const onItemClick = async (n) => {
    if (!n.is_read) await markRead(n.id);
    if (n.appointment_id) {
      setOpen(false);
      onJumpAppointments?.();
    }
  };

  return (
    <div style={{ position: "relative" }}>
      <button className="bell-btn" onClick={() => { setOpen(v => !v); if (!open) refresh(); }} title="Уведомления">
        <Ico name="bell" size={18} />
        {count > 0 && <span className="bell-badge">{count > 99 ? "99+" : count}</span>}
      </button>
      {open && (
        <>
          <div style={{ position: "fixed", inset: 0, zIndex: 55 }} onClick={() => setOpen(false)} />
          <div className="notif-pop" onClick={e => e.stopPropagation()}>
            <div className="notif-head">
              <div style={{ fontSize: 14, fontWeight: 700 }}>Уведомления</div>
              <button className="btn btn-secondary btn-sm" onClick={markAll} disabled={count === 0}>Прочитать все</button>
            </div>
            <div className="notif-list">
              {items.length === 0 && <div className="notif-empty">Пока нет уведомлений</div>}
              {items.map(n => (
                <div key={n.id} className={`notif-item${n.is_read ? "" : " notif-item--unread"}`} onClick={() => onItemClick(n)}>
                  <div className="notif-title">{n.title}</div>
                  {n.body && <div className="notif-body">{n.body}</div>}
                  <div className="notif-meta">
                    <span>{formatDt(n.created_at)}</span>
                    {me?.is_superadmin && n.clinic_name && <span className="badge badge-teal" style={{ fontSize: 10 }}>{n.clinic_name}</span>}
                    {n.type === "appointment_created" && n.appointment_id && (
                      <button className="btn btn-primary btn-sm" style={{ marginLeft: "auto" }}
                        onClick={async (e) => { e.stopPropagation(); await onConfirm?.(n.appointment_id); await markRead(n.id); }}>
                        Подтвердить
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}


// ── App ───────────────────────────────────────────────────
const NAV_ALL = [
  { id: "dashboard", label: "Дашборд", icon: "dashboard", group: null, super: false },
  { id: "appointments", label: "Записи", icon: "appointments", group: null, super: false },
  { id: "services", label: "Услуги", icon: "services", group: "Каталог", super: false },
  { id: "cities", label: "Города", icon: "city", group: "Каталог", super: true },
  { id: "clinics", label: "Клиники", icon: "clinic", group: "Каталог", super: false },
  { id: "doctors", label: "Врачи", icon: "doctor", group: "Каталог", super: false },
  { id: "content", label: "Контент", icon: "content", group: "Материалы", super: false },
  { id: "admin-users", label: "Администраторы", icon: "roles", group: "Система", super: true },
];

function App() {
  const [token, setToken] = React.useState(localStorage.getItem("admin_token"));
  const [adminUser, setAdminUser] = React.useState(localStorage.getItem("admin_username") || "");
  const [me, setMe] = React.useState(null);
  const [page, setPage] = useState("dashboard");
  const [data, setData] = useState(EMPTY_DATA);
  const [loading, setLoading] = React.useState(false);

  const PAGE_TITLES = {
    dashboard: "Дашборд", appointments: "Записи пациентов",
    services: "Услуги", cities: "Города",
    clinics: "Клиники", doctors: "Врачи", content: "Материалы для адаптации",
    "admin-users": "Администраторы",
  };

  const [apptBump, setApptBump] = React.useState(0);
  const handleConfirmFromBell = async (appointmentId) => {
    const r = await apiFetch(`/admin/api/appointments/${appointmentId}/confirm`, { method: "POST" });
    if (!r.ok) { const e = await r.json().catch(() => ({})); alert(e.detail || "Не удалось подтвердить"); return; }
    setApptBump(v => v + 1);
  };

  React.useEffect(() => {
    if (!token) return;
    setLoading(true);
    apiFetch("/admin/api/me")
      .then(r => r.json())
      .then(meData => {
        setMe(meData);
        return loadAllData(meData);
      })
      .then(d => { setData(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [token]);

  const handleLogin = (uname) => {
    setToken(localStorage.getItem("admin_token"));
    setAdminUser(uname);
  };

  const handleLogout = () => {
    localStorage.removeItem("admin_token");
    localStorage.removeItem("admin_username");
    setToken(null);
    setMe(null);
    setData(EMPTY_DATA);
  };

  if (!token) return <LoginScreen onLogin={handleLogin} />;

  const initials = adminUser ? adminUser.slice(0, 2).toUpperCase() : "АД";
  const isSuper = !!me?.is_superadmin;
  const NAV = NAV_ALL.filter(n => isSuper || !n.super);
  const groups = [...new Set(NAV.map(n => n.group))];
  const visibleIds = new Set(NAV.map(n => n.id));
  const safePage = visibleIds.has(page) ? page : "dashboard";
  const roleLabel = isSuper ? "Суперадминистратор" : (me?.clinic_name ? `Админ клиники · ${me.clinic_name}` : "Администратор");

  return (
    <div className="layout">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="sidebar-logo-title">Иду к врачу</div>
          <div className="sidebar-logo-sub">Панель управления</div>
          <div className="sidebar-badge">{isSuper ? "Super Admin" : "Clinic Admin"}</div>
        </div>
        <nav className="sidebar-nav">
          {groups.map(group => {
            const items = NAV.filter(n => n.group === group);
            return (
              <React.Fragment key={group || "top"}>
                {group && <div className="nav-section-label">{group}</div>}
                {items.map(item => (
                  <button key={item.id} className={`nav-item${safePage === item.id ? " active" : ""}`} onClick={() => setPage(item.id)}>
                    <div className="nav-icon"><Ico name={item.icon} size={15} /></div>
                    {item.label}
                  </button>
                ))}
              </React.Fragment>
            );
          })}
        </nav>
        <div className="sidebar-footer">
          <div className="admin-user">
            <div className="admin-avatar">{initials}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="admin-name">{adminUser}</div>
              <div className="admin-role" title={roleLabel} style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{roleLabel}</div>
            </div>
            <button onClick={handleLogout} title="Выйти" style={{ background: "none", border: "none", cursor: "pointer", color: "var(--text)", padding: 4 }}>
              <Ico name="logout" size={16} />
            </button>
          </div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <span className="topbar-title">{PAGE_TITLES[safePage]}</span>
          <div className="topbar-actions">
            {loading && <span style={{ fontSize: 12, color: "var(--text)" }}>Загрузка…</span>}
            {!isSuper && me?.clinic_name && <span className="badge badge-teal">{me.clinic_name}</span>}
            {me && <NotificationsBell me={me} onConfirm={handleConfirmFromBell} onJumpAppointments={() => setPage("appointments")} />}
            <div className="admin-avatar" style={{ width: 34, height: 34, fontSize: 12 }}>{initials}</div>
          </div>
        </header>
        <div className="content">
          {safePage === "dashboard" && <Dashboard data={data} />}
          {safePage === "appointments" && <AppointmentsSection key={apptBump} me={me} onChanged={() => setApptBump(v => v + 1)} />}
          {safePage === "services" && <ServicesSection data={data} setData={setData} me={me} />}
          {safePage === "cities" && <CitiesSection data={data} setData={setData} me={me} />}
          {safePage === "clinics" && <ClinicsSection data={data} setData={setData} me={me} />}
          {safePage === "doctors" && <DoctorsSection data={data} setData={setData} me={me} />}
          {safePage === "content" && <ContentSection data={data} setData={setData} me={me} />}
          {safePage === "admin-users" && isSuper && <AdminUsersSection data={data} setData={setData} me={me} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
