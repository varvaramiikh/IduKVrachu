<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Иду к врачу</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="/frontend/service-icons.js"></script>
  <style>
    :root {
      --brand: #12c7d4;
      --brand-dark: #006879;
      --btn-color: #00B9C2;
      --app-bg: #f0f5f7;
      --card: #ffffff;
      --title: #3B3B3B;
      --text: #848484;
      --stroke: #d9e4ea;
      --sidebar-w: 248px;
      --shadow: 0 4px 20px rgba(18,37,45,0.08);
      --shadow-lg: 0 8px 32px rgba(18,37,45,0.14);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Inter", Arial, sans-serif; background: var(--app-bg); color: var(--title); }
    button { font: inherit; cursor: pointer; }
    input, textarea, select { font: inherit; }
    a { text-decoration: none; color: inherit; }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: #fff;
      border-right: 1px solid var(--stroke);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--stroke);
    }
    .sidebar-logo-title {
      font-family: "Unbounded", sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--brand-dark);
      line-height: 1.2;
    }
    .sidebar-logo-sub {
      font-size: 11px;
      color: var(--text);
      margin-top: 2px;
    }
    .sidebar-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: 99px;
      background: rgba(18,199,212,0.12);
      color: var(--brand-dark);
      font-size: 10px;
      font-weight: 700;
      margin-top: 6px;
    }
    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-section-label {
      padding: 14px 20px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b0bec5;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 0;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .nav-item:hover { background: #f0f9fa; color: var(--brand-dark); }
    .nav-item.active { background: rgba(18,199,212,0.10); color: var(--brand-dark); font-weight: 600; }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--btn-color);
    }
    .nav-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      background: #f0f4f5;
    }
    .nav-item.active .nav-icon { background: rgba(18,199,212,0.18); }
    .nav-icon svg { width: 16px; height: 16px; }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--stroke);
    }
    .admin-user {
      display: flex; align-items: center; gap: 10px;
    }
    .admin-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .admin-name { font-size: 13px; font-weight: 600; color: var(--title); }
    .admin-role { font-size: 11px; color: var(--text); }

    /* Main */
    .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 60px;
      background: #fff;
      border-bottom: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 16px; font-weight: 700; color: var(--title); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .content { padding: 28px; flex: 1; }

    /* Cards */
    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-sm { padding: 16px; }

    /* Stats row */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex; align-items: flex-start; gap: 14px;
    }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--title); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--text); margin-top: 4px; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      border-bottom: 1px solid var(--stroke);
    }
    tbody td {
      padding: 13px 14px;
      font-size: 14px;
      color: var(--title);
      border-bottom: 1px solid #f4f7f8;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafcfd; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 18px; height: 38px;
      border-radius: 12px; border: none;
      font-size: 13px; font-weight: 600;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--btn-color); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #e9f5f7; color: var(--brand-dark); }
    .btn-danger { background: #fef2f2; color: #e53e3e; }
    .btn-sm { height: 30px; padding: 0 12px; font-size: 12px; border-radius: 8px; }
    .btn-icon {
      width: 32px; height: 32px; padding: 0;
      border-radius: 8px; background: #f0f4f5; color: var(--text); border: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { background: #e0f7f6; color: var(--brand-dark); }
    .btn-icon svg { width: 14px; height: 14px; }

    /* Section header */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
    }
    .section-title { font-size: 18px; font-weight: 700; color: var(--title); }
    .section-sub { font-size: 13px; color: var(--text); margin-top: 2px; }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px;
      border-radius: 99px; font-size: 11px; font-weight: 600;
    }
    .badge-teal { background: #e0f7f6; color: #128395; }
    .badge-gray { background: #f0f4f5; color: #848484; }
    .badge-orange { background: #fff4e6; color: #e67e22; }
    .badge-green { background: #e8f8f0; color: #27ae60; }
    .badge-red { background: #fef2f2; color: #e53e3e; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--title); }
    .form-label span { color: var(--text); font-weight: 400; }
    .form-input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--stroke);
      background: #fff;
      color: var(--title);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--btn-color); }
    .form-input::placeholder { color: #c0cdd4; }
    select.form-input { appearance: none; background-image: url("/frontend/materials/svg/icon-admin-select-chevron.svg"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
    textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.5; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.28);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal {
      background: #fff;
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      width: 100%; max-width: 580px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      animation: modalIn 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-lg { max-width: 720px; }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .modal-header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--title); }
    .modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      flex-shrink: 0;
    }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px;
      background: #f0f4f5; border: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); flex-shrink: 0;
    }
    .modal-close:hover { background: #fef2f2; color: #e53e3e; }

    /* Schedule grid */
    .schedule-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: 4px;
      font-size: 12px;
    }
    .sch-head {
      padding: 6px 4px;
      text-align: center;
      font-weight: 700;
      color: var(--text);
      font-size: 11px;
    }
    .sch-time {
      padding: 8px 4px;
      color: var(--text);
      font-size: 11px;
      display: flex;
      align-items: center;
    }
    .sch-slot {
      padding: 6px 2px;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--stroke);
      background: #fff;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .sch-slot.active { background: #e0f7f6; border-color: var(--btn-color); color: var(--brand-dark); font-weight: 700; }
    .sch-slot.busy { background: #f0f4f5; color: #c0cdd4; pointer-events: none; }

    /* Content type icon */
    .ctype-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: #f0f9fa;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* Role permission matrix */
    .perm-table table { table-layout: fixed; }
    .perm-table thead th { text-align: center; }
    .perm-table thead th:first-child { text-align: left; }
    .perm-table tbody td { text-align: center; }
    .perm-table tbody td:first-child { text-align: left; font-weight: 500; }
    .perm-check {
      width: 18px; height: 18px; border-radius: 5px;
      border: 1.5px solid var(--stroke);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .perm-check.on { background: var(--btn-color); border-color: var(--btn-color); }

    /* Tabs */
    .tabs { display: flex; gap: 4px; background: #f0f4f5; border-radius: 12px; padding: 4px; width: fit-content; margin-bottom: 22px; }
    .tab {
      padding: 8px 16px; border-radius: 9px; border: none;
      font-size: 13px; font-weight: 500; color: var(--text);
      background: transparent; transition: background 0.15s, color 0.15s;
    }
    .tab.active { background: #fff; color: var(--brand-dark); font-weight: 600; box-shadow: 0 2px 6px rgba(18,37,45,0.08); }

    /* Search */
    .search-input-wrap { position: relative; }
    .search-input-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text); pointer-events: none; }
    .search-input { padding-left: 34px !important; }

    /* Color dot */
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* Avatar initials */
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    /* Service icon picker */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .icon-pick {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1.5px solid var(--stroke);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      padding: 0;
    }
    .icon-pick:hover { border-color: var(--btn-color); color: var(--brand-dark); background: #f0f9fa; }
    .icon-pick--on {
      border-color: var(--btn-color);
      background: #e0f7f6;
      color: var(--brand-dark);
    }
    @media (max-width: 700px) { .icon-grid { grid-template-columns: repeat(4, 1fr); } }

    /* Day toggle */
    .day-toggle {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .day-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1.5px solid var(--stroke);
      background: #fff; font-size: 12px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .day-btn.on { background: #e0f7f6; border-color: var(--btn-color); color: var(--brand-dark); }

    /* Notifications */
    .bell-btn {
      position: relative;
      width: 38px; height: 38px;
      border-radius: 12px;
      border: 1.5px solid var(--stroke);
      background: #fff;
      color: var(--brand-dark);
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .bell-btn:hover { background: #f0f9fa; }
    .bell-badge {
      position: absolute;
      top: -4px; right: -4px;
      min-width: 18px; height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #e53e3e;
      color: #fff;
      font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
    }
    .notif-pop {
      position: absolute;
      top: 50px; right: 28px;
      width: 380px;
      max-height: 70vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      z-index: 60;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .notif-head {
      padding: 14px 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--stroke);
    }
    .notif-list { overflow-y: auto; flex: 1; }
    .notif-item {
      padding: 12px 18px;
      border-bottom: 1px solid #f4f7f8;
      cursor: pointer;
      transition: background 0.15s;
    }
    .notif-item:hover { background: #fafcfd; }
    .notif-item--unread { background: #f0f9fa; }
    .notif-item--unread:hover { background: #e6f4f6; }
    .notif-empty { padding: 32px 18px; text-align: center; color: var(--text); font-size: 13px; }
    .notif-title { font-size: 13px; font-weight: 600; color: var(--title); margin-bottom: 2px; }
    .notif-body { font-size: 12px; color: var(--text); white-space: pre-line; }
    .notif-meta { font-size: 11px; color: #a8b3b9; margin-top: 6px; display: flex; gap: 8px; align-items: center; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0dde3; border-radius: 3px; }

    /* Responsive note */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2,1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useMemo } = React;

// ── Icons ──────────────────────────────────────────────────
// Каждая иконка — отдельный SVG-файл в /frontend/materials/svg/,
// подключается через <img>, как и просили в задаче.
const ICON_FILES = {
  dashboard:    "/frontend/materials/svg/icon-admin-dashboard.svg",
  services:     "/frontend/materials/svg/icon-admin-services.svg",
  city:         "/frontend/materials/svg/icon-admin-city.svg",
  clinic:       "/frontend/materials/svg/icon-admin-clinic.svg",
  doctor:       "/frontend/materials/svg/icon-admin-doctor.svg",
  schedule:     "/frontend/materials/svg/icon-admin-schedule.svg",
  content:      "/frontend/materials/svg/icon-admin-content.svg",
  roles:        "/frontend/materials/svg/icon-admin-roles.svg",
  plus:         "/frontend/materials/svg/icon-admin-plus.svg",
  edit:         "/frontend/materials/svg/icon-admin-edit.svg",
  trash:        "/frontend/materials/svg/icon-admin-trash.svg",
  search:       "/frontend/materials/svg/icon-admin-search.svg",
  close:        "/frontend/materials/svg/icon-admin-close.svg",
  check:        "/frontend/materials/svg/icon-admin-check.svg",
  video:        "/frontend/materials/svg/icon-admin-video.svg",
  book:         "/frontend/materials/svg/icon-admin-book.svg",
  game:         "/frontend/materials/svg/icon-admin-game.svg",
  doc:          "/frontend/materials/svg/icon-admin-doc.svg",
  arrow_right:  "/frontend/materials/svg/icon-admin-arrow-right.svg",
  logout:       "/frontend/materials/svg/icon-admin-logout.svg",
  bell:         "/frontend/materials/svg/icon-admin-bell.svg",
  appointments: "/frontend/materials/svg/icon-admin-appointments.svg",
};

const Ico = ({ name, size = 16 }) => (
  <img src={ICON_FILES[name]} alt="" width={size} height={size} style={{ display: "inline-block", verticalAlign: "middle" }} />
);

// Рендер иконки услуги: SVG из общего набора по ключу либо эмодзи/текст.
// Цвет всегда брендовый #128395 — не настраивается.
const ServiceIcon = ({ icon, size = 22 }) => (
  <span
    style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", color: "#128395", width: size, height: size }}
    dangerouslySetInnerHTML={{ __html: window.renderServiceIconHTML ? window.renderServiceIconHTML(icon, size) : (icon || "⚕️") }}
  />
);

// ── API helper ────────────────────────────────────────────
const EMPTY_DATA = { directions: [], services: [], cities: [], clinics: [], doctors: [], content: [], roles: [], adminUsers: [] };

async function apiFetch(path, options = {}) {
  const token = localStorage.getItem("admin_token");
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.removeItem("admin_token");
    localStorage.removeItem("admin_username");
    window.location.reload();
    throw new Error("Unauthorized");
  }
  return res;
}

async function loadAllData(me) {
  const isSuper = !!(me && me.is_superadmin);
  const tasks = [
    apiFetch("/admin/api/directions").then(r => r.json()),
    apiFetch("/admin/api/services").then(r => r.json()),
    apiFetch("/admin/api/cities").then(r => r.json()),
    apiFetch("/admin/api/clinics").then(r => r.json()),
    apiFetch("/admin/api/doctors").then(r => r.json()),
    isSuper ? apiFetch("/admin/api/content").then(r => r.json()) : Promise.resolve([]),
    isSuper ? apiFetch("/admin/api/admin-users").then(r => r.json()) : Promise.resolve([]),
  ];
  const [directions, services, cities, clinics, doctors, content, adminUsers] = await Promise.all(tasks);
  return { directions, services, cities, clinics, doctors, content, roles: [], adminUsers };
}

// ── Login screen ──────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [username, setUsername] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError("");
    try {
      const res = await fetch("/admin/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("admin_token", data.token);
        localStorage.setItem("admin_username", data.username);
        onLogin(data.username);
      } else {
        setError("Неверный логин или пароль");
      }
    } catch {
      setError("Ошибка подключения к серверу");
    }
    setLoading(false);
  };

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", background: "var(--app-bg)" }}>
      <div style={{ background: "#fff", borderRadius: 20, padding: 40, width: 360, boxShadow: "var(--shadow-lg)" }}>
        <div style={{ fontFamily: "Unbounded, sans-serif", fontSize: 15, fontWeight: 700, color: "var(--brand-dark)", marginBottom: 4 }}>Иду к врачу</div>
        <div style={{ fontSize: 13, color: "var(--text)", marginBottom: 28 }}>Панель управления</div>
        <form onSubmit={submit}>
          <div className="form-group" style={{ marginBottom: 12 }}>
            <label className="form-label">Логин</label>
            <input className="form-input" value={username} onChange={e => setUsername(e.target.value)} placeholder="admin" autoFocus />
          </div>
          <div className="form-group" style={{ marginBottom: 20 }}>
            <label className="form-label">Пароль</label>
            <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
          </div>
          {error && <div style={{ color: "#e53e3e", fontSize: 13, marginBottom: 12 }}>{error}</div>}
          <button className="btn btn-primary" type="submit" disabled={loading} style={{ width: "100%", justifyContent: "center" }}>
            {loading ? "Входим…" : "Войти"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Services + Directions ─────────────────────────────────
function ServicesSection({ data, setData, me }) {
  const isSuper = !!me?.is_superadmin;
  const ownClinicId = me?.clinic_id ?? null;
  const [filterClinicId, setFilterClinicId] = useState(isSuper ? "all" : ownClinicId);
  const [dirModal, setDirModal] = useState(null);   // {mode:"add"|"edit", item?}
  const [dirForm, setDirForm] = useState({});
  const [svcModal, setSvcModal] = useState(null);
  const [svcForm, setSvcForm] = useState({});

  React.useEffect(() => {
    if (!isSuper) setFilterClinicId(ownClinicId);
  }, [isSuper, ownClinicId]);

  // Visible directions: filtered by clinic if super (or all clinics if "all"); clinic admin sees own.
  const visibleDirections = data.directions.filter(d => {
    if (!isSuper) return d.clinic_id === ownClinicId;
    if (filterClinicId === "all") return true;
    return d.clinic_id === filterClinicId;
  });

  const servicesByDirection = (dirId) => data.services.filter(s => s.direction_id === dirId);

  // ── Direction handlers ───
  const openAddDirection = (preselectClinicId) => {
    const cid = preselectClinicId || (isSuper ? (filterClinicId === "all" ? (data.clinics[0]?.id ?? null) : filterClinicId) : ownClinicId);
    setDirForm({
      clinic_id: cid,
      name: "", desc: "", icon: "doctor", color: "#128395", active: true,
      also_in_clinic_ids: [],
    });
    setDirModal({ mode: "add" });
  };
  const openEditDirection = (d) => {
    setDirForm({ ...d, also_in_clinic_ids: [] });
    setDirModal({ mode: "edit", id: d.id });
  };
  const saveDirection = async () => {
    if (!dirForm.name?.trim()) { alert("Укажите название направления"); return; }
    const isAdd = dirModal?.mode === "add";
    const url = isAdd ? "/admin/api/directions" : `/admin/api/directions/${dirModal.id}`;
    const payload = isAdd
      ? {
          clinic_id: dirForm.clinic_id || ownClinicId,
          name: dirForm.name, desc: dirForm.desc || "", icon: dirForm.icon || "",
          color: dirForm.color || "#128395", active: !!dirForm.active,
          also_in_clinic_ids: isSuper ? (dirForm.also_in_clinic_ids || []) : [],
        }
      : {
          name: dirForm.name, desc: dirForm.desc || "", icon: dirForm.icon || "",
          color: dirForm.color || "#128395", active: !!dirForm.active,
          also_in_clinic_ids: isSuper ? (dirForm.also_in_clinic_ids || []) : [],
        };
    const res = await apiFetch(url, { method: isAdd ? "POST" : "PUT", body: JSON.stringify(payload) });
    if (!res.ok) { const err = await res.json().catch(() => ({})); alert(err.detail || "Не удалось сохранить"); return; }
    // Refetch directions and services to capture any broadcast copies
    const [dirs, svcs, clinics] = await Promise.all([
      apiFetch("/admin/api/directions").then(r => r.json()),
      apiFetch("/admin/api/services").then(r => r.json()),
      apiFetch("/admin/api/clinics").then(r => r.json()),
    ]);
    setData(d => ({ ...d, directions: dirs, services: svcs, clinics }));
    setDirModal(null);
  };
  const deleteDirection = async (d) => {
    const svcCount = servicesByDirection(d.id).length;
    // Materials are canonical: they stay attached to other clinics' copies of
    // this direction. They only disappear if no clinic has this direction left.
    const siblings = data.directions.filter(x => x.name === d.name && x.id !== d.id).length;
    const matNote = siblings > 0
      ? ` Материалы направления «${d.name}» останутся доступны в других ${siblings === 1 ? "клинике" : "клиниках"}.`
      : ` Это последняя клиника с направлением «${d.name}» — материалы перестанут отображаться у пользователей.`;
    const msg = `Удалить направление «${d.name}»? Будут удалены ${svcCount} услуг этой клиники.${matNote}`;
    if (!confirm(msg)) return;
    const res = await apiFetch(`/admin/api/directions/${d.id}`, { method: "DELETE" });
    if (!res.ok) { alert("Не удалось удалить"); return; }
    setData(prev => ({
      ...prev,
      directions: prev.directions.filter(x => x.id !== d.id),
      services: prev.services.filter(s => s.direction_id !== d.id),
    }));
  };
  const toggleDirection = async (d) => {
    const res = await apiFetch(`/admin/api/directions/${d.id}`, {
      method: "PUT",
      body: JSON.stringify({
        name: d.name, desc: d.desc, icon: d.icon, color: d.color, active: !d.active,
      }),
    });
    if (!res.ok) return;
    const saved = await res.json();
    setData(prev => ({ ...prev, directions: prev.directions.map(x => x.id === d.id ? saved : x) }));
  };

  // ── Service handlers ────
  const openAddService = (directionId) => {
    const dir = data.directions.find(d => d.id === directionId);
    if (!dir) return;
    setSvcForm({
      direction_id: directionId,
      name: "", desc: "", icon: dir.icon || "doctor", active: true,
      also_in_clinic_ids: [],
    });
    setSvcModal({ mode: "add", clinic_id: dir.clinic_id });
  };
  const openEditService = (s) => {
    setSvcForm({ ...s, also_in_clinic_ids: [] });
    const dir = data.directions.find(d => d.id === s.direction_id);
    setSvcModal({ mode: "edit", id: s.id, clinic_id: dir?.clinic_id });
  };
  const saveService = async () => {
    if (!svcForm.name?.trim()) { alert("Укажите название услуги"); return; }
    if (!svcForm.direction_id) { alert("Выберите направление"); return; }
    const isAdd = svcModal?.mode === "add";
    const url = isAdd ? "/admin/api/services" : `/admin/api/services/${svcModal.id}`;
    const payload = isAdd
      ? {
          direction_id: svcForm.direction_id,
          name: svcForm.name, desc: svcForm.desc || "", icon: svcForm.icon || "", active: !!svcForm.active,
          also_in_clinic_ids: isSuper ? (svcForm.also_in_clinic_ids || []) : [],
        }
      : {
          direction_id: svcForm.direction_id,
          name: svcForm.name, desc: svcForm.desc || "", icon: svcForm.icon || "", active: !!svcForm.active,
          also_in_clinic_ids: isSuper ? (svcForm.also_in_clinic_ids || []) : [],
        };
    const res = await apiFetch(url, { method: isAdd ? "POST" : "PUT", body: JSON.stringify(payload) });
    if (!res.ok) { const err = await res.json().catch(() => ({})); alert(err.detail || "Не удалось сохранить"); return; }
    const [dirs, svcs, clinics] = await Promise.all([
      apiFetch("/admin/api/directions").then(r => r.json()),
      apiFetch("/admin/api/services").then(r => r.json()),
      apiFetch("/admin/api/clinics").then(r => r.json()),
    ]);
    setData(d => ({ ...d, directions: dirs, services: svcs, clinics }));
    setSvcModal(null);
  };
  const deleteService = async (s) => {
    if (!confirm(`Удалить услугу «${s.name}»?`)) return;
    const res = await apiFetch(`/admin/api/services/${s.id}`, { method: "DELETE" });
    if (!res.ok) { alert("Не удалось удалить"); return; }
    setData(d => ({ ...d, services: d.services.filter(x => x.id !== s.id) }));
  };
  const toggleService = async (s) => {
    const res = await apiFetch(`/admin/api/services/${s.id}`, {
      method: "PUT",
      body: JSON.stringify({
        direction_id: s.direction_id, name: s.name, desc: s.desc, icon: s.icon, active: !s.active,
      }),
    });
    if (!res.ok) return;
    const saved = await res.json();
    setData(d => ({ ...d, services: d.services.map(x => x.id === s.id ? saved : x) }));
  };

  // Group directions by clinic when super shows "all"
  const groupedByClinic = (() => {
    if (!isSuper || filterClinicId !== "all") {
      return [{ clinic_id: filterClinicId === "all" ? null : filterClinicId, clinic_name: null, directions: visibleDirections }];
    }
    const groups = {};
    visibleDirections.forEach(d => {
      if (!groups[d.clinic_id]) groups[d.clinic_id] = { clinic_id: d.clinic_id, clinic_name: d.clinic_name, directions: [] };
      groups[d.clinic_id].directions.push(d);
    });
    return Object.values(groups);
  })();

  const subTitle = isSuper
    ? "Управление направлениями и услугами всех клиник"
    : `Направления и услуги клиники: ${me?.clinic_name || ""}`;

  const canAddDirection = isSuper ? data.clinics.length > 0 : !!ownClinicId;

  return (
    <div>
      <div className="section-head">
        <div>
          <div className="section-title">Услуги</div>
          <div className="section-sub">{subTitle}</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {isSuper && (
            <select className="form-input" style={{ width: 220 }} value={filterClinicId} onChange={e => setFilterClinicId(e.target.value === "all" ? "all" : +e.target.value)}>
              <option value="all">Все клиники</option>
              {data.clinics.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          )}
          <button className="btn btn-secondary" onClick={() => openAddDirection()} disabled={!canAddDirection}><Ico name="plus" size={14} /> Направление</button>
        </div>
      </div>

      {visibleDirections.length === 0 && (
        <div className="card" style={{ textAlign: "center", padding: "40px 24px", color: "var(--text)" }}>
          <div style={{ fontSize: 14, marginBottom: 12 }}>Пока нет направлений</div>
          <button className="btn btn-primary" onClick={() => openAddDirection()} disabled={!canAddDirection}><Ico name="plus" size={14} /> Добавить направление</button>
        </div>
      )}

      {groupedByClinic.map(group => (
        <div key={group.clinic_id ?? "single"}>
          {isSuper && filterClinicId === "all" && group.clinic_name && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 4px", marginTop: 14 }}>
              <Ico name="clinic" size={14} />
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--title)" }}>{group.clinic_name}</span>
            </div>
          )}
          {group.directions.map(dir => {
            const svcs = servicesByDirection(dir.id);
            return (
              <div key={dir.id} className="card" style={{ marginBottom: 14, padding: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", borderBottom: "1px solid #f0f4f5", background: "#fbfdfd", borderRadius: "16px 16px 0 0" }}>
                  <ServiceIcon icon={dir.icon} size={22} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "var(--title)" }}>{dir.name}</div>
                    {dir.desc && <div style={{ fontSize: 12, color: "var(--text)" }}>{dir.desc}</div>}
                  </div>
                  <Toggle on={dir.active} onChange={() => toggleDirection(dir)} />
                  <button className="btn-icon" title="Редактировать направление" onClick={() => openEditDirection(dir)}><Ico name="edit" /></button>
                  <button className="btn-icon" style={{ background: "#fef2f2", color: "#e53e3e" }} title="Удалить направление" onClick={() => deleteDirection(dir)}><Ico name="trash" /></button>
                  <button className="btn btn-primary" style={{ padding: "6px 12px", fontSize: 12 }} onClick={() => openAddService(dir.id)}><Ico name="plus" size={12} /> Услуга</button>
                </div>
                <div className="table-wrap">
                  <table>
                    <thead><tr>
                      <th>Услуга</th><th>Описание</th><th>Статус</th><th style={{ width: 100 }}>Действия</th>
                    </tr></thead>
                    <tbody>
                      {svcs.map(s => (
                        <tr key={s.id}>
                          <td><span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><ServiceIcon icon={s.icon} size={20} /><strong>{s.name}</strong></span></td>
                          <td style={{ color: "var(--text)", fontSize: 13 }}>{s.desc}</td>
                          <td><Toggle on={s.active} onChange={() => toggleService(s)} /></td>
                          <td>
                            <div style={{ display: "flex", gap: 6 }}>
                              <button className="btn-icon" onClick={() => openEditService(s)}><Ico name="edit" /></button>
                              <button className="btn-icon" style={{ background: "#fef2f2", color: "#e53e3e" }} onClick={() => deleteService(s)}><Ico name="trash" /></button>
                            </div>
                          </td>
                        </tr>
                      ))}
                      {svcs.length === 0 && (
                        <tr><td colSpan={4} style={{ textAlign: "center", padding: 24, color: "var(--text)", fontSize: 13 }}>Услуг пока нет</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {/* Direction modal */}
      {dirModal && (
        <Modal title={dirModal.mode === "add" ? "Добавить направление" : "Редактировать направление"} onClose={() => setDirModal(null)} lg
          footer={<><button className="btn btn-secondary" onClick={() => setDirModal(null)}>Отмена</button><button className="btn btn-primary" onClick={saveDirection}>Сохранить</button></>}>
          <div className="form-grid">
            {isSuper && dirModal.mode === "add" && (
              <div className="form-group form-full">
                <label className="form-label">Клиника</label>
                <select className="form-input" value={dirForm.clinic_id || ""} onChange={e => setDirForm(f => ({ ...f, clinic_id: +e.target.value }))}>
                  {data.clinics.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
            )}
            <div className="form-group form-full">
              <label className="form-label">Название направления</label>
              <input className="form-input" value={dirForm.name || ""} onChange={e => setDirForm(f => ({ ...f, name: e.target.value }))} placeholder="Например: Стоматология" />
            </div>
            <div className="form-group form-full">
              <label className="form-label">Иконка</label>
              <div className="icon-grid">

// ── Avatar crop dialog ────────────────────────────────────
function AvatarCropDialog({ src, onConfirm, onCancel }) {
  const SIZE = 240;
  const OUTPUT = 256;
  const canvasRef = React.useRef(null);
  const imgRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const [imgSize, setImgSize] = React.useState({ w: 0, h: 0 });
  const [scale, setScale] = React.useState(1);
  const [offset, setOffset] = React.useState({ x: 0, y: 0 });
  const [ready, setReady] = React.useState(false);

  const minScale = imgSize.w ? Math.max(SIZE / imgSize.w, SIZE / imgSize.h) : 1;
  const maxScale = minScale * 4;

  const clamp = (ox, oy, sc) => ({
    x: Math.min(0, Math.max(SIZE - imgSize.w * sc, ox)),
    y: Math.min(0, Math.max(SIZE - imgSize.h * sc, oy)),
  });

  const onImgLoad = () => {
    const img = imgRef.current;
    if (!img) return;
    const w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.max(SIZE / w, SIZE / h);
    setImgSize({ w, h });
    setScale(sc);
    setOffset({ x: (SIZE - w * sc) / 2, y: (SIZE - h * sc) / 2 });
    setReady(true);
  };

  const startDrag = (cx, cy) => { dragRef.current = { cx, cy, ox: offset.x, oy: offset.y }; };
  const moveDrag = (cx, cy) => {
    if (!dragRef.current) return;
    const { cx: sx, cy: sy, ox, oy } = dragRef.current;
    setOffset(clamp(ox + cx - sx, oy + cy - sy, scale));
  };
  const endDrag = () => { dragRef.current = null; };

  const handleScaleChange = (newSc) => {
    if (!scale) return;
    const cx = SIZE / 2, cy = SIZE / 2;
    const newOx = cx - (cx - offset.x) / scale * newSc;
    const newOy = cy - (cy - offset.y) / scale * newSc;
    setScale(newSc);
    setOffset(clamp(newOx, newOy, newSc));
  };

  const handleConfirm = () => {
    const canvas = canvasRef.current;
    canvas.width = OUTPUT;
    canvas.height = OUTPUT;
    const ctx = canvas.getContext("2d");
    const srcX = -offset.x / scale;
    const srcY = -offset.y / scale;
    const srcSide = SIZE / scale;
    ctx.drawImage(imgRef.current, srcX, srcY, srcSide, srcSide, 0, 0, OUTPUT, OUTPUT);
    onConfirm(canvas.toDataURL("image/jpeg", 0.92));
  };

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 10000,
      background: "rgba(15, 23, 42, 0.55)", display: "flex",
      alignItems: "center", justifyContent: "center", padding: 16,
    }}>
      <div style={{
        background: "#fff", borderRadius: 18, padding: "22px 22px 20px",
        width: 320, maxWidth: "100%",
        boxShadow: "0 20px 60px rgba(15, 23, 42, 0.28)",
      }}>
        <h3 style={{ margin: "0 0 4px", fontSize: 16, fontWeight: 700, color: "var(--title)" }}>Выбор области фото</h3>
        <p style={{ margin: "0 0 16px", fontSize: 13, color: "var(--text)" }}>Перетащите изображение и настройте масштаб</p>

        <div style={{ position: "relative", width: SIZE, height: SIZE, margin: "0 auto 18px" }}>
          <div
            style={{
              position: "absolute", inset: 0, borderRadius: "50%",
              overflow: "hidden", cursor: "grab",
              background: "#f3f4f6", userSelect: "none",
              touchAction: "none",
              boxShadow: "0 0 0 3px var(--brand)",
            }}
            onMouseDown={e => { e.preventDefault(); startDrag(e.clientX, e.clientY); }}
            onMouseMove={e => moveDrag(e.clientX, e.clientY)}
            onMouseUp={endDrag}
            onMouseLeave={endDrag}
            onTouchStart={e => startDrag(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={e => { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }}
            onTouchEnd={endDrag}
          >
            <img
              ref={imgRef}
              src={src}
              alt=""
              draggable={false}
              onLoad={onImgLoad}
              style={{
                position: "absolute",
                left: offset.x, top: offset.y,
                width: imgSize.w * scale || "auto",
                height: imgSize.h * scale || "auto",
                maxWidth: "none",
                pointerEvents: "none",
              }}
            />
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
          <span style={{ fontSize: 18, color: "#9ca3af", lineHeight: 1, width: 12, textAlign: "center" }}>−</span>
          <input
            type="range"
            style={{ flex: 1, accentColor: "var(--brand)" }}
            min={minScale} max={maxScale}
            step={(maxScale - minScale) / 100 || 0.01}
            value={scale}
            disabled={!ready}
            onChange={e => handleScaleChange(parseFloat(e.target.value))}
          />
          <span style={{ fontSize: 18, color: "#9ca3af", lineHeight: 1, width: 12, textAlign: "center" }}>+</span>
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-secondary" style={{ flex: 1 }} onClick={onCancel}>Отмена</button>
          <button className="btn btn-primary" style={{ flex: 1 }} onClick={handleConfirm} disabled={!ready}>Применить</button>
        </div>
        <canvas ref={canvasRef} style={{ display: "none" }} />
      </div>
    </div>
  );
}

  const [scheduleDoctor, setScheduleDoctor] = useState(null);
  const [cropDialog, setCropDialog] = useState(null);
  const isSuper = !!me?.is_superadmin;

  const COLORS = ["#16a085","#2980b9","#8e44ad","#e74c3c","#e67e22","#27ae60","#2c3e50"];
  const defaultClinic = isSuper ? data.clinics[0] : data.clinics.find(c => c.id === me?.clinic_id);
  const empty = { name: "", spec: "", clinic: defaultClinic?.name || "", clinic_id: defaultClinic?.id || null, exp: 0, minAge: 0, color: COLORS[0], initials: "", avatar: null, active: true };

  const save = async () => {
    const url = modal === "add" ? "/admin/api/doctors" : `/admin/api/doctors/${form.id}`;
    const res = await apiFetch(url, { method: modal === "add" ? "POST" : "PUT", body: JSON.stringify(form) });
    const saved = await res.json();
    if (modal === "add") setData(d => ({ ...d, doctors: [...d.doctors, saved] }));
    else setData(d => ({ ...d, doctors: d.doctors.map(dr => dr.id === form.id ? saved : dr) }));
    setModal(null);
  };
  const del = async (id) => {
    await apiFetch(`/admin/api/doctors/${id}`, { method: "DELETE" });
    setData(d => ({ ...d, doctors: d.doctors.filter(dr => dr.id !== id) }));
  };
  const toggle = async (id) => {
    const dr = data.doctors.find(d => d.id === id);
    const res = await apiFetch(`/admin/api/doctors/${id}`, { method: "PUT", body: JSON.stringify({ ...dr, active: !dr.active }) });
    const saved = await res.json();
    setData(d => ({ ...d, doctors: d.doctors.map(dr => dr.id === id ? saved : dr) }));
  };

  return (
    <div>
      <div className="section-head">
        <div><div className="section-title">Врачи</div><div className="section-sub">Специалисты клиник</div></div>
        <button className="btn btn-primary" onClick={() => { setForm({ ...empty }); setModal("add"); }}><Ico name="plus" size={14} /> Добавить врача</button>
      </div>
      <div className="card" style={{ padding: 0 }}>
        <div className="table-wrap"><table>
          <thead><tr><th>Специалист</th><th>Специализация</th><th>Клиника</th><th>Стаж</th><th>Мин. возраст</th><th>Статус</th><th style={{width:120}}>Действия</th></tr></thead>
          <tbody>{data.doctors.map(dr => (
            <tr key={dr.id}>
              <td><div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {dr.avatar
                  ? <img src={dr.avatar} alt="" className="avatar" style={{ width: 32, height: 32, objectFit: "cover" }} />
                  : <div className="avatar" style={{ background: dr.color, width: 32, height: 32, fontSize: 11 }}>{dr.initials}</div>}
                <strong style={{ fontSize: 13 }}>{dr.name}</strong>
              </div></td>
              <td style={{ fontSize: 13, color: "var(--text)" }}>{dr.spec}</td>
              <td style={{ fontSize: 13 }}>{dr.clinic}</td>
              <td>{dr.exp} лет</td>
              <td>с {dr.minAge} лет</td>
              <td><Toggle on={dr.active} onChange={() => toggle(dr.id)} /></td>
              <td><div style={{ display: "flex", gap: 6 }}>
                <button className="btn-icon" title="Расписание" onClick={() => setScheduleDoctor(dr)} style={{ background: "#e0f7f6", color: "#128395" }}><Ico name="schedule" /></button>
                <button className="btn-icon" onClick={() => { setForm({ ...dr }); setModal("edit"); }}><Ico name="edit" /></button>
                <button className="btn-icon" style={{ background: "#fef2f2", color: "#e53e3e" }} onClick={() => del(dr.id)}><Ico name="trash" /></button>
              </div></td>
            </tr>
          ))}</tbody>
        </table></div>
      </div>
      {modal && (
        <Modal title={modal === "add" ? "Добавить врача" : "Редактировать врача"} onClose={() => setModal(null)}
          footer={<><button className="btn btn-secondary" onClick={() => setModal(null)}>Отмена</button><button className="btn btn-primary" onClick={save}>Сохранить</button></>}>
          <div className="form-grid">
            <div className="form-group form-full">
              <label className="form-label">ФИО врача</label>
              <input className="form-input" value={form.name || ""} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Петрова Анна Викторовна" />
            </div>
            <div className="form-group">
              <label className="form-label">Специализация</label>
              <input className="form-input" value={form.spec || ""} onChange={e => setForm(f => ({ ...f, spec: e.target.value }))} placeholder="Стоматолог-терапевт" />
            </div>
            <div className="form-group">
              <label className="form-label">Клиника</label>
              <select className="form-input" value={form.clinic_id || ""} disabled={!isSuper}
                onChange={e => { const c = data.clinics.find(x => x.id === +e.target.value); setForm(f => ({ ...f, clinic_id: +e.target.value, clinic: c?.name || "" })); }}>
                {data.clinics.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Стаж (лет)</label>
              <input className="form-input" type="number" value={form.exp || ""} onChange={e => setForm(f => ({ ...f, exp: +e.target.value }))} placeholder="12" />
            </div>
            <div className="form-group">
              <label className="form-label">Минимальный возраст</label>
              <input className="form-input" type="number" value={form.minAge ?? ""} onChange={e => setForm(f => ({ ...f, minAge: +e.target.value }))} placeholder="3" />
            </div>
            <div className="form-group form-full">
              <label className="form-label">Фото врача</label>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 4 }}>
                {form.avatar
                  ? <img src={form.avatar} alt="" style={{ width: 56, height: 56, borderRadius: "50%", objectFit: "cover" }} />
                  : <div className="avatar" style={{ background: form.color || COLORS[0], width: 56, height: 56, fontSize: 16 }}>{form.initials || "?"}</div>}
                <label className="btn btn-secondary" style={{ cursor: "pointer", margin: 0 }}>
                  {form.avatar ? "Заменить" : "Загрузить"}
                  <input type="file" accept="image/*" style={{ display: "none" }}
                    onChange={e => {
                      const file = e.target.files?.[0];
                      if (!file) return;
                      if (file.size > 5 * 1024 * 1024) { alert("Файл больше 5 МБ"); return; }
                      const reader = new FileReader();
                      reader.onload = () => setCropDialog({ src: reader.result });
                      reader.readAsDataURL(file);
                      e.target.value = "";
                    }} />
                </label>
                {form.avatar && (
                  <button className="btn btn-secondary" onClick={() => setForm(f => ({ ...f, avatar: null }))}>Удалить</button>
                )}
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Инициалы (для аватара)</label>
              <input className="form-input" value={form.initials || ""} onChange={e => setForm(f => ({ ...f, initials: e.target.value }))} placeholder="АП" maxLength={2} />
            </div>
            <div className="form-group">
              <label className="form-label">Цвет аватара</label>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4 }}>
                {COLORS.map(c => (
                  <button key={c} onClick={() => setForm(f => ({ ...f, color: c }))}
                    style={{ width: 28, height: 28, borderRadius: 8, background: c, border: form.color === c ? "2px solid var(--title)" : "2px solid transparent", cursor: "pointer" }} />
                ))}
              </div>
            </div>
          </div>
        </Modal>
      )}
      {scheduleDoctor && <ScheduleModal doctor={scheduleDoctor} onClose={() => setScheduleDoctor(null)} />}
      {cropDialog && (
        <AvatarCropDialog
          src={cropDialog.src}
          onConfirm={cropped => { setForm(f => ({ ...f, avatar: cropped })); setCropDialog(null); }}
          onCancel={() => setCropDialog(null)}
        />
      )}
    </div>
  );
}

// ── Schedule modal ────────────────────────────────────────
function ScheduleModal({ doctor, onClose }) {
  const TIMES = ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","12:00","13:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30"];
  const emptySlots = () => {
    const s = {};
    DAYS.forEach((d, di) => { s[di] = {}; TIMES.forEach(t => { s[di][t] = false; }); });
    return s;
  };
  const [slots, setSlots] = useState(emptySlots);
  const [workDays, setWorkDays] = useState([0,1,2,3,4]);
  const [saving, setSaving] = React.useState(false);

  React.useEffect(() => {
    apiFetch(`/admin/api/doctors/${doctor.id}/schedule`).then(r => r.json()).then(({ slots: raw }) => {
      const s = emptySlots();
      for (const [day, times] of Object.entries(raw || {})) {
        for (const [t, v] of Object.entries(times)) { if (s[+day]) s[+day][t] = !!v; }
      }
      setSlots(s);
      const activeDays = Object.entries(raw || {}).filter(([, times]) => Object.values(times).some(Boolean)).map(([d]) => +d);
      if (activeDays.length) setWorkDays(activeDays);
    });
  }, [doctor.id]);

  const toggle = (di, t) => setSlots(s => ({ ...s, [di]: { ...s[di], [t]: !s[di][t] } }));
  const toggleDay = (di) => setWorkDays(w => w.includes(di) ? w.filter(x => x !== di) : [...w, di]);

  const saveSchedule = async () => {
    setSaving(true);
    const payload = {};
    DAYS.forEach((d, di) => { payload[String(di)] = {}; TIMES.forEach(t => { payload[String(di)][t] = workDays.includes(di) && !!slots[di]?.[t]; }); });
    await apiFetch(`/admin/api/doctors/${doctor.id}/schedule`, { method: "PUT", body: JSON.stringify({ slots: payload }) });
    setSaving(false);
    onClose();
  };

  return (
    <Modal title={`Расписание — ${doctor.name}`} onClose={onClose} lg
      footer={<><button className="btn btn-secondary" onClick={onClose}>Отмена</button><button className="btn btn-primary" onClick={saveSchedule} disabled={saving}>{saving ? "Сохраняем…" : "Сохранить расписание"}</button></>}>
      <div style={{ marginBottom: 16 }}>
        <div className="form-label" style={{ marginBottom: 8 }}>Рабочие дни</div>
        <div className="day-toggle">
          {DAYS.map((d, di) => (
            <button key={di} className={`day-btn${workDays.includes(di) ? " on" : ""}`} onClick={() => toggleDay(di)}>{d}</button>
          ))}
        </div>
      </div>
      <div style={{ marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--text)", marginBottom: 8 }}>
          <span className="badge badge-teal">■ Доступен</span>
          <span className="badge badge-gray">■ Недоступен</span>
          <span style={{ marginLeft: "auto" }}>Нажмите на ячейку для переключения</span>
        </div>
      </div>
      <div style={{ overflowX: "auto" }}>
        <div className="schedule-grid" style={{ minWidth: 520 }}>
          <div className="sch-head">Время</div>
          {DAYS.map((d, di) => (
            <div key={di} className="sch-head" style={{ color: workDays.includes(di) ? "var(--brand-dark)" : "#c0cdd4" }}>{d}</div>
          ))}
          {TIMES.map(t => (
            <React.Fragment key={t}>
              <div className="sch-time">{t}</div>
              {DAYS.map((d, di) => (
                <button key={di}
                  className={`sch-slot${!workDays.includes(di) ? " busy" : slots[di]?.[t] ? " active" : ""}`}
                  onClick={() => workDays.includes(di) && toggle(di, t)}
                  style={{ cursor: workDays.includes(di) ? "pointer" : "default" }}>
                  {workDays.includes(di) ? (slots[di]?.[t] ? "✓" : "—") : "—"}
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>
      </div>
    </Modal>
  );
}

// ── Content (super-only) ──────────────────────────────────
function ContentSection({ data, setData, me }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [filterDirection, setFilterDirection] = useState("all");

  // Materials are canonical (one row per direction name across all clinics).
  // Build a unique list of direction names with a representative icon/color
  // (first occurrence wins) for tabs and the form dropdown.
  const directionOptions = useMemo(() => {
    const map = new Map();
    for (const d of data.directions) {
      if (!d.name || map.has(d.name)) continue;
      map.set(d.name, { name: d.name, icon: d.icon, color: d.color || "#128395" });
    }
    return [...map.values()];
  }, [data.directions]);

  const filtered = data.content.filter(c => {
    if (filterDirection !== "all" && c.direction_name !== filterDirection) return false;
    return true;
  });

  const openAdd = () => {
    setForm({
      direction_name: directionOptions[0]?.name || "",
      type: CONTENT_TYPES[0], title: "", desc: "", duration: 4, url: "", active: true,
    });
    setModal("add");
  };
  const openEdit = (item) => { setForm({ ...item }); setModal("edit"); };

  const toPayload = (f) => ({
    direction_name: f.direction_name,
    type: f.type, title: f.title, desc: f.desc || "",
    duration: f.duration || null, url: f.url || "", active: !!f.active,
  });

  const save = async () => {
    if (!form.direction_name) { alert("Выберите направление"); return; }
    if (!form.title?.trim()) { alert("Укажите название"); return; }
    const isAdd = modal === "add";
    const url = isAdd ? "/admin/api/content" : `/admin/api/content/${form.id}`;
    const res = await apiFetch(url, { method: isAdd ? "POST" : "PUT", body: JSON.stringify(toPayload(form)) });
    if (!res.ok) { const err = await res.json().catch(() => ({})); alert(err.detail || "Не удалось сохранить материал"); return; }
    const saved = await res.json();
    if (isAdd) {
      setData(d => ({ ...d, content: [...d.content, saved] }));
    } else {
      setData(d => ({ ...d, content: d.content.map(c => c.id === form.id ? saved : c) }));
    }
    setModal(null);
  };
  const del = async (item) => {
    if (!confirm(`Удалить материал «${item.title}»? Он исчезнет во всех клиниках с направлением «${item.direction_name}».`)) return;
    await apiFetch(`/admin/api/content/${item.id}`, { method: "DELETE" });
    setData(d => ({ ...d, content: d.content.filter(c => c.id !== item.id) }));
  };
  const toggle = async (id) => {
    const item = data.content.find(c => c.id === id);
    const res = await apiFetch(`/admin/api/content/${id}`, { method: "PUT", body: JSON.stringify(toPayload({ ...item, active: !item.active })) });
    const saved = await res.json();
    setData(d => ({ ...d, content: d.content.map(c => c.id === id ? saved : c) }));
  };

  const typeInfo = (type) => CONTENT_TYPE_ICONS[type] || { icon: "doc", bg: "#f0f9fa", color: "#128395" };

  return (
    <div>
      <div className="section-head">
        <div>
          <div className="section-title">Материалы для адаптации</div>
          <div className="section-sub">Контент по направлениям — отображается во всех клиниках, где есть это направление</div>
        </div>
        <button className="btn btn-primary" onClick={openAdd} disabled={directionOptions.length === 0}><Ico name="plus" size={14} /> Добавить материал</button>
      </div>

      <div className="tabs">
        <button className={`tab${filterDirection === "all" ? " active" : ""}`} onClick={() => setFilterDirection("all")}>Все направления</button>
        {directionOptions.map(d => (
          <button key={d.name} className={`tab${filterDirection === d.name ? " active" : ""}`} onClick={() => setFilterDirection(d.name)} style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
            <ServiceIcon icon={d.icon} size={16} /> {d.name}
          </button>
        ))}
      </div>

      <div style={{ display: "grid", gap: 10 }}>
        {filtered.map((item) => {
          const ti = typeInfo(item.type);
          return (
            <div key={item.id} style={{ background: "#fff", borderRadius: 16, padding: "16px 20px", boxShadow: "var(--shadow)", display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ color: "#d0d8dc", cursor: "grab", fontSize: 16, flexShrink: 0 }}>⠿</div>
              <div className="ctype-icon" style={{ background: ti.bg, color: ti.color }}>
                <Ico name={ti.icon} size={18} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#128395", marginBottom: 2 }}>{item.type}</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: "var(--title)", marginBottom: 2 }}>{item.title}</div>
                <div style={{ fontSize: 12, color: "var(--text)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.desc}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                {item.duration && <span className="badge badge-gray">⏱ {item.duration} мин</span>}
                <span className="badge badge-teal">{item.direction_name || "—"}</span>
              </div>
              <Toggle on={item.active} onChange={() => toggle(item.id)} />
              <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                <button className="btn-icon" onClick={() => openEdit(item)}><Ico name="edit" /></button>
                <button className="btn-icon" style={{ background: "#fef2f2", color: "#e53e3e" }} onClick={() => del(item)}><Ico name="trash" /></button>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div className="card" style={{ textAlign: "center", color: "var(--text)", padding: "40px 24px" }}>
            Нет материалов для выбранного фильтра
          </div>
        )}
      </div>

      {modal && (
        <Modal title={modal === "add" ? "Добавить материал" : "Редактировать материал"} onClose={() => setModal(null)} lg
          footer={<><button className="btn btn-secondary" onClick={() => setModal(null)}>Отмена</button><button className="btn btn-primary" onClick={save}>Сохранить</button></>}>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Направление</label>
              <select className="form-input" value={form.direction_name || ""} onChange={e => setForm(f => ({ ...f, direction_name: e.target.value }))}>
                {directionOptions.map(d => <option key={d.name} value={d.name}>{d.name}</option>)}
              </select>
              <div style={{ fontSize: 11, color: "var(--text)", marginTop: 4 }}>Материал автоматически появится во всех клиниках, где есть это направление.</div>
            </div>
            <div className="form-group">
              <label className="form-label">Тип материала</label>
              <select className="form-input" value={form.type || ""} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
                {CONTENT_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group form-full">
              <label className="form-label">Название</label>
              <input className="form-input" value={form.title || ""} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="Иду к стоматологу" />
            </div>
            <div className="form-group form-full">
              <label className="form-label">Описание</label>
              <textarea className="form-input" value={form.desc || ""} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} placeholder="Краткое описание для пользователя" rows={3} />
            </div>
            <div className="form-group">
              <label className="form-label">Длительность <span>(мин, необяз.)</span></label>
              <input className="form-input" type="number" value={form.duration || ""} onChange={e => setForm(f => ({ ...f, duration: +e.target.value || null }))} placeholder="4" />
            </div>
            <div className="form-group">
              <label className="form-label">Ссылка на контент <span>(URL)</span></label>
              <input className="form-input" value={form.url || ""} onChange={e => setForm(f => ({ ...f, url: e.target.value }))} placeholder="https://..." />
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Roles ─────────────────────────────────────────────────
function RolesSection({ data, setData }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const COLORS = ["#e53e3e","#2980b9","#27ae60","#e67e22","#8e44ad","#16a085"];
  const emptyPerms = () => Object.fromEntries(PERM_SECTIONS.map(s => [s, [0,0,0,0]]));
  const empty = { name: "", desc: "", color: COLORS[0], perms: emptyPerms() };

  const save = async () => {
    const url = modal === "add" ? "/admin/api/roles" : `/admin/api/roles/${form.id}`;
    const res = await apiFetch(url, { method: modal === "add" ? "POST" : "PUT", body: JSON.stringify(form) });
    const saved = await res.json();
    if (modal === "add") setData(d => ({ ...d, roles: [...d.roles, saved] }));
    else setData(d => ({ ...d, roles: d.roles.map(r => r.id === form.id ? saved : r) }));
    setModal(null);
  };
  const del = async (id) => {
    await apiFetch(`/admin/api/roles/${id}`, { method: "DELETE" });
    setData(d => ({ ...d, roles: d.roles.filter(r => r.id !== id) }));
  };
  const togglePerm = (sec, idx) => {
    setForm(f => {
      const perms = { ...f.perms, [sec]: f.perms[sec].map((v, i) => i === idx ? (v ? 0 : 1) : v) };
      return { ...f, perms };
    });
  };

  return (
    <div>
      <div className="section-head">
        <div><div className="section-title">Роли и права</div><div className="section-sub">Управление доступом пользователей</div></div>
        <button className="btn btn-primary" onClick={() => { setForm({ ...empty, perms: emptyPerms() }); setModal("add"); }}><Ico name="plus" size={14} /> Создать роль</button>
      </div>

      <div style={{ display: "grid", gap: 16 }}>
        {data.roles.map(role => (
          <div key={role.id} className="card">
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 12, height: 12, borderRadius: 4, background: role.color, flexShrink: 0, marginTop: 2 }} />
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "var(--title)" }}>{role.name}</div>
                  <div style={{ fontSize: 13, color: "var(--text)" }}>{role.desc}</div>
                </div>

function formatDt(s) {
  if (!s) return "";
  // Backend serializes naive UTC datetimes (no offset); add 'Z' so the browser
  // converts to the local timezone (UTC+3 for Moscow clinics).
  const iso = (s.includes("Z") || s.includes("+") || /[-]\d{2}:\d{2}$/.test(s)) ? s : s + "Z";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ── Notifications bell ────────────────────────────────────
function NotificationsBell({ me, onConfirm, onJumpAppointments }) {
  const [open, setOpen] = useState(false);
  const [items, setItems] = useState([]);
  const [count, setCount] = useState(0);

  const refresh = React.useCallback(async () => {
    try {
      const [listRes, cntRes] = await Promise.all([
        apiFetch("/admin/api/notifications?limit=50"),
        apiFetch("/admin/api/notifications/unread-count"),
      ]);
      if (listRes.ok) setItems(await listRes.json());
      if (cntRes.ok) setCount((await cntRes.json()).count || 0);
    } catch {}
  }, []);

  React.useEffect(() => {
    refresh();
    const t = setInterval(refresh, 20000);
    return () => clearInterval(t);
  }, [refresh]);

  const markRead = async (id) => {
    await apiFetch(`/admin/api/notifications/${id}/read`, { method: "POST" });
    refresh();
  };
  const markAll = async () => {
    await apiFetch("/admin/api/notifications/read-all", { method: "POST" });
    refresh();
  };

  const onItemClick = async (n) => {
    if (!n.is_read) await markRead(n.id);
    if (n.appointment_id) {
      setOpen(false);
      onJumpAppointments?.();
    }
  };

  return (
    <div style={{ position: "relative" }}>
      <button className="bell-btn" onClick={() => { setOpen(v => !v); if (!open) refresh(); }} title="Уведомления">
        <Ico name="bell" size={18} />
        {count > 0 && <span className="bell-badge">{count > 99 ? "99+" : count}</span>}
      </button>
      {open && (
        <>
          <div style={{ position: "fixed", inset: 0, zIndex: 55 }} onClick={() => setOpen(false)} />
          <div className="notif-pop" onClick={e => e.stopPropagation()}>
            <div className="notif-head">
              <div style={{ fontSize: 14, fontWeight: 700 }}>Уведомления</div>
              <button className="btn btn-secondary btn-sm" onClick={markAll} disabled={count === 0}>Прочитать все</button>
            </div>
            <div className="notif-list">
              {items.length === 0 && <div className="notif-empty">Пока нет уведомлений</div>}
              {items.map(n => (
                <div key={n.id} className={`notif-item${n.is_read ? "" : " notif-item--unread"}`} onClick={() => onItemClick(n)}>
                  <div className="notif-title">{n.title}</div>
                  {n.body && <div className="notif-body">{n.body}</div>}
                  <div className="notif-meta">
                    <span>{formatDt(n.created_at)}</span>
                    {me?.is_superadmin && n.clinic_name && <span className="badge badge-teal" style={{ fontSize: 10 }}>{n.clinic_name}</span>}
                    {n.type === "appointment_created" && n.appointment_id && (
                      <button className="btn btn-primary btn-sm" style={{ marginLeft: "auto" }}
                        onClick={async (e) => { e.stopPropagation(); await onConfirm?.(n.appointment_id); await markRead(n.id); }}>
                        Подтвердить
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

      <div className="main">
        <header className="topbar">
          <span className="topbar-title">{PAGE_TITLES[safePage]}</span>
          <div className="topbar-actions">
            {loading && <span style={{ fontSize: 12, color: "var(--text)" }}>Загрузка…</span>}
            {!isSuper && me?.clinic_name && <span className="badge badge-teal">{me.clinic_name}</span>}
            {me && <NotificationsBell me={me} onConfirm={handleConfirmFromBell} onJumpAppointments={() => setPage("appointments")} />}
            <div className="admin-avatar" style={{ width: 34, height: 34, fontSize: 12 }}>{initials}</div>
          </div>
        </header>
        <div className="content">
          {safePage === "dashboard" && <Dashboard data={data} me={me} />}
          {safePage === "appointments" && <AppointmentsSection key={apptBump} me={me} onChanged={() => setApptBump(v => v + 1)} />}
          {safePage === "services" && <ServicesSection data={data} setData={setData} me={me} />}
          {safePage === "cities" && <CitiesSection data={data} setData={setData} me={me} />}
          {safePage === "clinics" && <ClinicsSection data={data} setData={setData} me={me} />}
          {safePage === "doctors" && <DoctorsSection data={data} setData={setData} me={me} />}
          {safePage === "content" && <ContentSection data={data} setData={setData} me={me} />}
          {safePage === "admin-users" && isSuper && <AdminUsersSection data={data} setData={setData} me={me} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
